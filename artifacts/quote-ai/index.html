<!DOCTYPE html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>quoteai – Instant Quotes for Canadian Contractors | AI in 30s</title>
    <meta name="description" content="Create professional quotes in 30 seconds with AI. Quoting software for Canadian contractors, tradespeople and small businesses. No Excel, no mistakes. Try it free." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="quoteai" />
    <!--
      Production: the prerender pipeline (`scripts/prerender-seo.ts`)
      writes the correct per-route <link rel="canonical"> directly into
      every prerendered HTML file, so the snippet below is stripped/
      replaced and never reaches a crawler in prod.

      Dev/preview: the SPA shell is served for every route. The inline
      script below sets a canonical that matches the current URL before
      React mounts, so SEO audits (Lighthouse, Semrush) running against
      the dev preview don't see every page canonicalizing to "/".
      <SeoHead> (react-helmet-async) then refines it per-route after
      hydration.
    -->
    <link id="__canonical" rel="canonical" href="https://quoteai.ca/" />
    <script>
      (function () {
        try {
          var origin = "https://quoteai.ca";
          var p = window.location.pathname || "/";
          if (p.length > 1 && p.charAt(p.length - 1) !== "/" && p.lastIndexOf(".") <= p.lastIndexOf("/")) {
            p = p + "/";
          }
          var links = document.head.querySelectorAll('link[rel="canonical"]');
          var keep = document.getElementById("__canonical");
          if (!keep && links.length > 0) keep = links[0];
          if (!keep) {
            keep = document.createElement("link");
            keep.setAttribute("rel", "canonical");
            document.head.appendChild(keep);
          }
          keep.setAttribute("id", "__canonical");
          keep.setAttribute("href", origin + p);
          for (var i = 0; i < links.length; i++) {
            if (links[i] !== keep && links[i].parentNode) {
              links[i].parentNode.removeChild(links[i]);
            }
          }
          // Customer-private token pages (/p quote, /i invoice, /sign contract, /t worker, /team-invite) are noindex too (Phase 68).
          var noindexPrefixes = ["/dashboard", "/sign-in", "/sign-up", "/onboarding", "/admin", "/reset-password", "/forgot-password", "/p", "/i", "/sign", "/t", "/team-invite"];
          for (var j = 0; j < noindexPrefixes.length; j++) {
            if (p === noindexPrefixes[j] + "/" || p.indexOf(noindexPrefixes[j] + "/") === 0) {
              var robots = document.head.querySelector('meta[name="robots"]');
              if (!robots) {
                robots = document.createElement("meta");
                robots.setAttribute("name", "robots");
                document.head.appendChild(robots);
              }
              robots.setAttribute("content", "noindex, nofollow");
              break;
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- PWA (Phase 77): installable shell; the service worker is registered from src/lib/pwa.ts. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="QuoteAI" />

    <!-- Google tag (gtag.js) — loaded on the first user interaction or after
         5 s, whichever comes first, so the 170 kB tag never competes with the
         page's own JS on mobile (Phase 68). Events queued in dataLayer before
         then are delivered once it loads. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-D2B39E0ELW');
      (function () {
        var done = false;
        var events = ["pointerdown", "keydown", "touchstart", "scroll"];
        var load = function () {
          if (done) return;
          done = true;
          for (var i = 0; i < events.length; i++) window.removeEventListener(events[i], load);
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=G-D2B39E0ELW";
          document.head.appendChild(s);
        };
        for (var j = 0; j < events.length; j++) window.addEventListener(events[j], load, { once: true, passive: true });
        window.setTimeout(load, 5000);
      })();
    </script>

    <!-- Theme -->
    <meta name="theme-color" content="#7C3AED" />
    <script>
      (function () {
        try {
          if (
            window.localStorage.getItem("quoteai-theme") === "dark" &&
            window.location.pathname.indexOf("/dashboard") === 0
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>

    <!-- Resource hints -->
    <link rel="dns-prefetch" href="https://wa.me" />

    <!-- Self-hosted Figtree Variable (the site typeface) — preloaded for zero render-blocking.
         Inter stays declared in index.css as the fallback face; it is only fetched if used. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/figtree-latin-wght-normal.woff2"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
