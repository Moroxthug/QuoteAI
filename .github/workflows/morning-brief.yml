# Pocket (docs/POCKET-DESIGN-PLAN.md, Phase 149): the phone's 6:30 morning brief.
# Every half hour through the Canadian mornings (09:00-15:30 UTC covers 6:30 from
# Newfoundland to British Columbia, summer and winter), the API sends each company its
# brief once, between 6:30 and 7:29 its local time (artifacts/api-server/src/today/brief.ts).
# Needs the repository secret CRON_SECRET (the same value as in Vercel).
name: Morning brief

on:
  schedule:
    - cron: "*/30 9-15 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the briefs that are due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping."; exit 0; fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" https://quoteai.ca/api/cron/morning
