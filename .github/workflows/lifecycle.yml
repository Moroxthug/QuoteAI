# Phase 134 (docs/GROWTH-PLAN.md): the lifecycle emails to people who signed up.
# Hourly; the API itself sends only 8:00-20:00 in each company's time zone, at most one email per person per 24 h,
# and nothing at all unless LIFECYCLE_EMAILS_ENABLED=1 is set on the API (LIFECYCLE_DRY_RUN=1 only logs).
# Needs the repository secret CRON_SECRET (the same value as in Vercel).
name: Lifecycle emails

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the lifecycle emails that are due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping."; exit 0; fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" https://quoteai.ca/api/cron/lifecycle
