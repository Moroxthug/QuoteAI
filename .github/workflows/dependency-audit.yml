name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Phase 64: blocking. The only advisories at the time were xlsx (moved to
      # the SheetJS 0.20.3 tarball — npm stops at 0.18.5) and a dev-only esbuild low.
      - run: pnpm audit --audit-level=high
