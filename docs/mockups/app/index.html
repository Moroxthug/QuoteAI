<title>QuoteAI App Mockups</title>
<meta name="description" content="Phase 114: the QuoteAI phone app, designed first. Every screen at real size, English and French, light and dark, to approve or change one by one.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* ============ Review page chrome (follows the viewer's theme) ============ */
:root{
  --r-bg:#f3f3f7; --r-panel:#ffffff; --r-line:#dfe1e8; --r-ink:#16172e; --r-body:#3a3b4a; --r-muted:#646677;
  --r-navy:#101031; --r-on-navy:#ffffff; --r-soft:#eceef4;
  --r-ok:#227a15; --r-ok-t:#e7f4e3; --r-warn:#7a5c00; --r-warn-t:#fdf3c4; --r-focus:#4a4ad6;
  --font:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --r-bg:#0b0c16; --r-panel:#151626; --r-line:#2a2c42; --r-ink:#eceef8; --r-body:#c9cbd8; --r-muted:#9597aa;
    --r-navy:#e4e4fa; --r-on-navy:#101031; --r-soft:#1e2033;
    --r-ok:#79d466; --r-ok-t:rgba(121,212,102,.14); --r-warn:#f0cf4b; --r-warn-t:rgba(240,207,75,.14); --r-focus:#9d9dff;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --r-bg:#0b0c16; --r-panel:#151626; --r-line:#2a2c42; --r-ink:#eceef8; --r-body:#c9cbd8; --r-muted:#9597aa;
  --r-navy:#e4e4fa; --r-on-navy:#101031; --r-soft:#1e2033;
  --r-ok:#79d466; --r-ok-t:rgba(121,212,102,.14); --r-warn:#f0cf4b; --r-warn-t:rgba(240,207,75,.14); --r-focus:#9d9dff;
}
*{box-sizing:border-box}
body{background:var(--r-bg);color:var(--r-body);font-family:var(--font);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--r-focus);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--r-bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:12px;border-bottom:1px solid var(--r-line);margin-inline:-16px;padding-inline:16px}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand b{color:var(--r-ink);font-size:16px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--r-muted)}
.seg{display:inline-flex;background:var(--r-soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--r-muted);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--r-panel);color:var(--r-ink);box-shadow:0 1px 3px rgba(16,16,49,.12)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--r-muted)}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:24px;align-items:start;padding-top:20px;max-width:1240px;margin:0 auto}
.nav{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.nav h3{margin:0 0 4px}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.nav li button{width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:10px;display:flex;align-items:center;gap:9px;cursor:pointer;color:var(--r-body);font-size:13.5px}
.nav li button:hover{background:var(--r-soft)}
.nav li button[aria-current="true"]{background:var(--r-panel);color:var(--r-ink);font-weight:700;box-shadow:0 1px 3px rgba(16,16,49,.08)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--r-line);flex:none}
.dot.approved{background:var(--r-ok)} .dot.change{background:var(--r-warn)}
.progress{background:var(--r-panel);border:1px solid var(--r-line);border-radius:14px;padding:12px 14px}
.progress b{color:var(--r-ink);font-size:15px}
.bar{height:6px;border-radius:3px;background:var(--r-soft);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--r-ok);border-radius:3px}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;max-width:430px}
.stage-head h2{margin:0;color:var(--r-ink);font-size:18px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.stage-head .n{font-size:12px;color:var(--r-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{border:1px solid var(--r-line);background:var(--r-panel);border-radius:12px;min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--r-ink);padding:0 10px;font-weight:600;font-size:13px}
.iconbtn svg{width:18px;height:18px}
.stage-foot{display:flex;gap:8px;width:100%;max-width:430px;justify-content:space-between}
.panel{position:sticky;top:90px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--r-panel);border:1px solid var(--r-line);border-radius:16px;padding:16px}
.card h3{margin:0 0 10px;color:var(--r-ink);font-size:15px}
.notes dl{margin:0;display:flex;flex-direction:column;gap:10px}
.notes dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--r-muted)}
.notes dd{margin:2px 0 0;color:var(--r-body);font-size:13.5px}
.rv-status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--r-soft);color:var(--r-muted)}
.rv-status.approved{background:var(--r-ok-t);color:var(--r-ok)} .rv-status.change{background:var(--r-warn-t);color:var(--r-warn)}
.rv-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{border:1px solid var(--r-line);background:var(--r-panel);color:var(--r-ink);border-radius:12px;min-height:44px;padding:0 14px;font-weight:700;font-size:14px;cursor:pointer}
.btn.primary{background:var(--r-navy);border-color:var(--r-navy);color:var(--r-on-navy)}
.btn:disabled{opacity:.5;cursor:default}
textarea.note{width:100%;min-height:84px;margin-top:10px;border:1px solid var(--r-line);background:var(--r-bg);border-radius:12px;padding:10px 12px;font-size:16px;resize:vertical}
.saved{font-size:12px;color:var(--r-muted);margin-top:8px;min-height:1.2em}
.tabs{display:flex;gap:4px;margin-inline:auto;max-width:1240px;padding-top:14px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:700;color:var(--r-muted);cursor:pointer;min-height:40px}
.tabs button[aria-selected="true"]{background:var(--r-panel);color:var(--r-ink);box-shadow:0 1px 3px rgba(16,16,49,.08)}
.mobile-only{display:none}
@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr) 300px}
  .nav{display:none}
  .mobile-only{display:flex}
}
@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .panel{position:static}
  .top{gap:8px}
}
.picker{width:100%;max-width:430px;min-height:44px;border:1px solid var(--r-line);background:var(--r-panel);border-radius:12px;padding:0 12px;font-size:16px;color:var(--r-ink)}

/* ============ Spec tab ============ */
.spec{max-width:1040px;margin:0 auto;padding-top:20px;display:flex;flex-direction:column;gap:28px}
.spec h2{margin:0 0 4px;color:var(--r-ink);font-size:22px;letter-spacing:-.015em}
.spec h3{margin:18px 0 8px;color:var(--r-ink);font-size:16px}
.spec p{max-width:68ch;margin:6px 0}
.tw{overflow-x:auto;border:1px solid var(--r-line);border-radius:14px;background:var(--r-panel)}
.tw table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
.tw th,.tw td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--r-line);vertical-align:top}
.tw th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--r-muted);font-weight:700}
.tw tr:last-child td{border-bottom:0}
.tw td b{color:var(--r-ink)}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sw{border:1px solid var(--r-line);border-radius:12px;overflow:hidden;background:var(--r-panel);font-size:12px}
.sw i{display:flex;height:44px}
.sw i s{flex:1;text-decoration:none}
.sw div{padding:8px 10px}
.sw b{display:block;color:var(--r-ink);font-size:12.5px}
.sw code{font-size:11px;color:var(--r-muted)}
.type-row{display:flex;align-items:baseline;gap:14px;padding:8px 0;border-bottom:1px solid var(--r-line);flex-wrap:wrap}
.type-row code{width:150px;font-size:11.5px;color:var(--r-muted);flex:none}
.type-row span{color:var(--r-ink)}

/* ============ The device ============ */
.dev-wrap{position:relative}
.dev{--w:390px;--h:844px;width:var(--w);height:var(--h);max-width:100%;border-radius:46px;padding:10px;background:#0a0a14;box-shadow:0 30px 60px rgba(16,16,49,.22),inset 0 0 0 1.5px #2a2a3a}
.dev-screen{position:relative;width:100%;height:100%;border-radius:37px;overflow:hidden;background:var(--a-bg);isolation:isolate}
@media (max-width:760px){
  .dev{--h:780px;padding:0;border-radius:24px;background:transparent;box-shadow:0 10px 30px rgba(16,16,49,.16)}
  .dev-screen{border-radius:24px;border:1px solid var(--r-line)}
}
.hold{position:fixed;inset:0;z-index:100;background:#000}
.hold .dev{width:100%;height:100%;max-width:none;border-radius:0;padding:0;box-shadow:none}
.hold .dev-screen{border-radius:0;border:0}
.hold-bar{display:none}
.hold .hold-bar{display:flex;position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;z-index:50;gap:4px;align-items:center;background:rgba(10,10,20,.72);color:#fff;border-radius:999px;padding:3px;backdrop-filter:blur(8px)}
.hold-bar button{border:0;background:transparent;color:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hold-bar svg{width:18px;height:18px}
.hold-bar span{font-size:12px;font-variant-numeric:tabular-nums;padding:0 4px}

/* ---- App tokens: light (default) ---- */
.dev{
  --a-bg:#f6f6f9; --a-surface:#ffffff; --a-surface-2:#eef0f4; --a-line:#e3e5eb; --a-line-2:#d3d6de;
  --a-title:#16172e; --a-ink:#34354a; --a-muted:#666879; --a-faint:#8a8c9b;
  --a-primary:#101031; --a-primary-press:#24244a; --a-on-primary:#ffffff;
  --a-green:#227a15; --a-green-t:#e7f4e3; --a-teal:#0a7580; --a-teal-t:#e1f3f2;
  --a-amber:#7a5c00; --a-amber-t:#fdf3c4; --a-red:#bf3d09; --a-red-t:#fdece3;
  --a-violet:#5b2bd6; --a-violet-t:#efe9fd; --a-on-violet:#ffffff;
  --a-grey-t:#eef0f4; --a-scrim:rgba(16,16,49,.38); --a-shadow:0 1px 2px rgba(16,16,49,.06);
  --a-sheet-shadow:0 -10px 40px rgba(16,16,49,.18); --a-bar:rgba(255,255,255,.92); --a-sb:#16172e;
  color-scheme:light;
}
.dev.a-dark{
  --a-bg:#0d0e1a; --a-surface:#171828; --a-surface-2:#212336; --a-line:#2a2c42; --a-line-2:#383b55;
  --a-title:#eeeff8; --a-ink:#cfd1dd; --a-muted:#9a9cae; --a-faint:#77798d;
  --a-primary:#e4e4fa; --a-primary-press:#c9c9ef; --a-on-primary:#101031;
  --a-green:#79d466; --a-green-t:rgba(121,212,102,.14); --a-teal:#5cccd6; --a-teal-t:rgba(92,204,214,.14);
  --a-amber:#f0cf4b; --a-amber-t:rgba(240,207,75,.14); --a-red:#ff8f66; --a-red-t:rgba(255,143,102,.14);
  --a-violet:#7c4dff; --a-violet-t:rgba(169,139,255,.16); --a-on-violet:#ffffff;
  --a-grey-t:#23253a; --a-scrim:rgba(0,0,0,.55); --a-shadow:none;
  --a-sheet-shadow:0 -10px 40px rgba(0,0,0,.5); --a-bar:rgba(23,24,40,.94); --a-sb:#eeeff8;
  color-scheme:dark;
}

/* ---- App components (all scoped to the device) ---- */
.dev-screen{font-family:var(--font);color:var(--a-ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--a-bg)}
.sb{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:14px;font-weight:700;color:var(--a-sb)}
.sb-r{display:flex;gap:5px;align-items:center}
.sb svg{width:16px;height:16px}
.ab{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px}
.ab.back{padding-left:4px}
.ab h1{flex:1;min-width:0;margin:0;font-size:17px;font-weight:700;color:var(--a-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab h1.big{font-size:26px;font-weight:800;letter-spacing:-.02em}
.tb{width:44px;height:44px;border:0;background:transparent;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--a-title);cursor:pointer;flex:none;position:relative}
.tb svg{width:22px;height:22px}
.tb.mic{background:var(--a-violet-t);color:var(--a-violet);width:40px;height:40px;margin-right:2px}
.a-dark .tb.mic{color:#c9b6ff}
.tb .badge{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--a-red);box-shadow:0 0 0 2px var(--a-bg)}
.co{display:flex;align-items:center;gap:6px;flex:1;min-width:0;font-weight:700;font-size:15px;color:var(--a-title);border:0;background:transparent;padding:0}
.co .mk{width:30px;height:30px;border-radius:9px;background:var(--a-primary);color:var(--a-on-primary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.co span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co svg{width:16px;height:16px;color:var(--a-muted);flex:none}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.body>*,.sh-b>*,.fr>*{flex-shrink:0}
.body.flush{padding-left:0;padding-right:0}
.tabbar{flex:none;display:flex;background:var(--a-bar);border-top:1px solid var(--a-line);padding:6px 4px 0}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;color:var(--a-muted);font-size:11px;font-weight:600;cursor:pointer;min-height:48px;position:relative}
.tabbar button svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--a-title)}
.tabbar button[aria-current="page"] svg{stroke-width:2.2}
.tabbar .tdot{position:absolute;top:3px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--a-red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.home-ind{flex:none;height:22px;display:flex;align-items:center;justify-content:center;background:var(--a-bar)}
.home-ind::after{content:"";width:130px;height:5px;border-radius:3px;background:var(--a-title);opacity:.85}
.layer.no-tabs .home-ind{background:transparent}
.dock{flex:none;display:flex;gap:8px;padding:10px 16px;background:var(--a-bar);border-top:1px solid var(--a-line)}
.btn-a{min-height:48px;border-radius:14px;border:1px solid var(--a-line-2);background:var(--a-surface);color:var(--a-title);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;cursor:pointer;white-space:nowrap}
.btn-a svg{width:19px;height:19px}
.btn-a.pri{background:var(--a-primary);border-color:var(--a-primary);color:var(--a-on-primary);flex:1}
.btn-a.sq{width:48px;padding:0;flex:none}
.btn-a.grow{flex:1}
.btn-a.sm{min-height:34px;border-radius:10px;font-size:13px;padding:0 12px}
.btn-a.sm.pri{flex:none}
.btn-a.big{min-height:60px;font-size:18px;border-radius:18px}
.btn-a.green{background:var(--a-green);border-color:var(--a-green);color:#fff}
.a-dark .btn-a.green{color:#0d1a0a}
.btn-a.ghost{border-color:transparent;background:transparent}

h2.sec{margin:6px 0 -2px;font-size:17px;font-weight:700;color:var(--a-title);display:flex;align-items:center;justify-content:space-between}
h2.sec a,.link{font-size:13px;font-weight:600;color:var(--a-teal);text-decoration:none}
.greet h2{margin:2px 0 0;font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--a-title)}
.meta{font-size:13px;color:var(--a-muted)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grp{background:var(--a-surface);border:1px solid var(--a-line);border-radius:16px;overflow:hidden;box-shadow:var(--a-shadow)}
.grp-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 4px}
.grp-h b{font-size:15px;color:var(--a-title)}
.lr{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px;border-top:1px solid var(--a-line);cursor:pointer;background:transparent;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0;color:inherit}
.grp>.lr:first-child,.grp>.grp-h+.lr{border-top:0}
.lr .ic{width:38px;height:38px;border-radius:11px;background:var(--a-surface-2);display:flex;align-items:center;justify-content:center;color:var(--a-title);flex:none}
.lr .ic svg{width:19px;height:19px}
.lr .ic.av{border-radius:50%;font-size:13px;font-weight:700}
.lr .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lr .t1{font-size:15px;font-weight:600;color:var(--a-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .t2{font-size:13px;color:var(--a-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .t2.wrap{white-space:normal}
.lr .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.lr .amt{font-size:15px;font-weight:700;color:var(--a-title)}
.lr .chev{width:18px;height:18px;color:var(--a-faint);flex:none}
.chip-a{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--a-grey-t);color:var(--a-muted);white-space:nowrap}
.chip-a.green{background:var(--a-green-t);color:var(--a-green)} .chip-a.teal{background:var(--a-teal-t);color:var(--a-teal)}
.chip-a.amber{background:var(--a-amber-t);color:var(--a-amber)} .chip-a.red{background:var(--a-red-t);color:var(--a-red)}
.chip-a.violet{background:var(--a-violet-t);color:var(--a-violet)}
.a-dark .chip-a.violet{color:#c9b6ff}
.chip-a svg{width:12px;height:12px}
.strip{display:grid;grid-template-columns:1fr 1fr;background:var(--a-surface);border:1px solid var(--a-line);border-radius:16px;overflow:hidden}
.strip>div{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.strip>div:nth-child(odd){border-right:1px solid var(--a-line)}
.strip>div:nth-child(n+3){border-top:1px solid var(--a-line)}
.strip .k{font-size:12px;color:var(--a-muted);font-weight:600}
.strip .v{font-size:22px;font-weight:800;color:var(--a-title);letter-spacing:-.02em}
.strip .d{font-size:12px;color:var(--a-muted)}
.strip .d.up{color:var(--a-green)} .strip .d.bad{color:var(--a-red)}
.ask{display:flex;align-items:center;gap:8px;background:var(--a-surface);border:1px solid var(--a-line);border-radius:16px;padding:6px 6px 6px 6px;cursor:pointer}
.ask .m{width:40px;height:40px;border-radius:12px;background:var(--a-violet);color:var(--a-on-violet);display:flex;align-items:center;justify-content:center;flex:none}
.ask .m svg{width:20px;height:20px}
.ask span{flex:1;font-size:14px;color:var(--a-faint)}

<script>
(function(){
"use strict";
/* ---------------- state ---------------- */
let L = 'en';
let theme = 'auto';
let idx = 0;
const stack = [];
const reviews = {};
let db = null;
const t = (en, fr) => L === 'fr' ? fr : en;
const nf = (n, d) => n.toLocaleString(L === 'fr' ? 'fr-CA' : 'en-CA', {minimumFractionDigits:d||0, maximumFractionDigits:d||0});
const $m = (n, d) => L === 'fr' ? nf(n, d) + ' $' : '$' + nf(n, d);
const hrs = n => nf(n, 1) + ' h';
const pct = n => L === 'fr' ? n + ' %' : n + '%';
const ic = (n, c) => `<i data-lucide="${n}"${c ? ` class="${c}"` : ''}></i>`;
const chip = (k, s, i) => `<span class="chip-a ${k||''}">${i ? ic(i) : ''}${s}</span>`;

/* ---------------- shared pieces ---------------- */
const sb = (off) => `<div class="sb"><span>9:41</span><span class="sb-r">${off ? ic('wifi-off') + ic('signal-zero') : ic('signal') + ic('wifi')}${ic('battery-full')}</span></div>`;
const company = () => `<button class="co" data-go="more"><span class="mk">TR</span><span>Tremblay Rénovations</span>${ic('chevron-down')}</button>`;
const rootBar = (title, opts) => `<div class="ab">${title ? `<h1 class="big">${title}</h1>` : company()}<button class="tb mic" data-go="assistant" aria-label="${t('Assistant','Assistant')}">${ic('mic')}</button>${opts && opts.noPlus ? '' : `<button class="tb" aria-label="${t('New','Nouveau')}">${ic('plus')}</button>`}</div>`;
const backBar = (title, more, extra) => `<div class="ab back"><button class="tb" data-back aria-label="${t('Back','Retour')}">${ic('chevron-left')}</button><h1>${title}</h1>${extra||''}${more === false ? '' : `<button class="tb" aria-label="${t('More actions','Plus d’actions')}">${ic('ellipsis')}</button>`}</div>`;
const TABS = {
  owner: () => [['today','house',t('Today','Aujourd’hui')],['quotes','file-text',t('Quotes','Soumissions')],['jobs','hard-hat',t('Jobs','Chantiers')],['money','wallet',t('Money','Argent')],['more','layout-grid',t('More','Plus'),2]],
  foreman: () => [['foreman','house',t('Today','Aujourd’hui')],['jobs','hard-hat',t('Jobs','Chantiers')],['schedule','calendar-days',t('Schedule','Horaire')],['crew','users',t('Crew','Équipe')],['more','layout-grid',t('More','Plus')]],
  worker: () => [['now','clock-3',t('Now','Maintenant')],['tasks','list-checks',t('Tasks','Tâches')],['report','notebook-pen',t('Report','Rapport')],['me','user-round',t('Me','Moi')]]
};
const tabbar = (role, on) => `<nav class="tabbar">${TABS[role]().map(([id,i,l,b]) => `<button data-tab="${id}" ${id===on?'aria-current="page"':''}>${ic(i)}<span>${l}</span>${b?`<span class="tdot">${b}</span>`:''}</button>`).join('')}</nav><div class="home-ind"></div>`;
const noTabs = () => `<div class="home-ind"></div>`;
const lr = (o) => `<div class="lr" ${o.go?`data-go="${o.go}"`:''}>${o.ic?`<span class="ic ${o.av?'av':''}" ${o.icStyle?`style="${o.icStyle}"`:''}>${o.av?o.ic:ic(o.ic)}</span>`:''}<span class="tx"><span class="t1">${o.t1}</span>${o.t2?`<span class="t2 ${o.wrap?'wrap':''}">${o.t2}</span>`:''}</span>${o.end!==undefined?`<span class="end">${o.end}</span>`:''}${o.chev?ic('chevron-right','chev'):''}</div>`;

const GROUPS = [['owner','Owner and office'],['states','Offline and sync'],['foreman','Foreman'],['worker','Crew'],['first','First run']];
const byId = Object.fromEntries(S.map((s,i)=>[s.id,i]));
const TAB_TARGET = {today:'today',quotes:'quotes',jobs:'jobs',money:'money',more:'more',foreman:'foreman',schedule:'schedule',crew:'foreman',now:'now',tasks:'now',report:'now',me:'now'};
// A sheet screen's base: what you pop back to.
const SHEET_BASE = {send:'quote', dictate:'new-quote', invoice:'money'};

/* ---------------- device rendering ---------------- */
const screenEl = document.getElementById('screen');
const dev = document.getElementById('dev');
const mq = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const dark = theme === 'dark' || (theme === 'auto' && mq.matches);
  dev.classList.toggle('a-dark', dark);
}
try { mq.addEventListener('change', applyTheme); } catch(e) {}
function icons(root){ if (window.lucide) { try { window.lucide.createIcons({attrs:{'stroke-width':1.75,width:'1em',height:'1em'}, nameAttr:'data-lucide'}); } catch(e){} } }
function mount(i, mode){
  const s = S[i];
  const old = screenEl.querySelector('.layer:last-child');
  const layer = document.createElement('div');
  layer.className = 'layer';
  layer.innerHTML = s.html();
  if (!layer.querySelector('.tabbar')) layer.classList.add('no-tabs');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!old || mode === 'jump') { screenEl.innerHTML = ''; screenEl.appendChild(layer); }
  else {
    screenEl.appendChild(layer);
    const cls = mode === 'push' ? ['l-push-in','l-push-out'] : mode === 'pop' ? ['l-pop-in','l-pop-out'] : mode === 'sheet' ? ['l-sheet-in',null] : ['l-fade-in',null];
    layer.classList.add(cls[0]);
    if (cls[1]) old.classList.add(cls[1]);
    if (mode === 'pop') { layer.style.zIndex = 1; }
    const done = () => { [...screenEl.querySelectorAll('.layer')].forEach(l => { if (l !== layer) l.remove(); }); layer.classList.remove('l-push-in','l-pop-in','l-fade-in','l-sheet-in'); };
    setTimeout(done, reduce ? 140 : 340);
  }
  icons(layer);
}
function show(i, mode){
  idx = (i + S.length) % S.length;
  mount(idx, mode || 'jump');
  syncChrome();
}
screenEl.addEventListener('click', e => {
  const back = e.target.closest('[data-back]');
  const go = e.target.closest('[data-go]');
  const tab = e.target.closest('[data-tab]');
  const sh = e.target.closest('[data-sheet]');
  if (sh) { stack.push(idx); show(byId[sh.dataset.sheet], 'sheet'); return; }
  if (go && byId[go.dataset.go] !== undefined) { stack.push(idx); show(byId[go.dataset.go], 'push'); return; }
  if (tab) { const tgt = TAB_TARGET[tab.dataset.tab]; if (tgt !== undefined) { stack.length = 0; show(byId[tgt], 'fade'); } return; }
  if (back) {
    const cur = S[idx].id;
    let prev = stack.length ? stack.pop() : (SHEET_BASE[cur] ? byId[SHEET_BASE[cur]] : idx - 1);
    show(prev, S[idx].sheet ? 'fade' : 'pop');
  }
});

/* ---------------- review chrome ---------------- */
const $ = id => document.getElementById(id);
function statusLabel(st){ return st === 'approved' ? 'Approved' : st === 'change' ? 'Change asked' : 'Not reviewed'; }
function renderNav(){
  const nav = $('nav'); const picker = $('picker');
  nav.innerHTML = GROUPS.map(([g,label]) => `<div><h3 class="lbl">${label}</h3><ul>${S.map((s,i)=> s.g!==g ? '' : `<li><button data-i="${i}" ${i===idx?'aria-current="true"':''}><span class="dot ${reviews[s.id]?.status||''}"></span>${s.name()}</button></li>`).join('')}</ul></div>`).join('');
  picker.innerHTML = GROUPS.map(([g,label]) => `<optgroup label="${label}">${S.map((s,i)=> s.g!==g ? '' : `<option value="${i}" ${i===idx?'selected':''}>${(reviews[s.id]?.status==='approved'?'✓ ':reviews[s.id]?.status==='change'?'• ':'')}${s.name()}</option>`).join('')}</optgroup>`).join('');
  const ok = S.filter(s => reviews[s.id]?.status === 'approved').length;
  const ch = S.filter(s => reviews[s.id]?.status === 'change').length;
  $('prog').innerHTML = `<b>${ok} of ${S.length} approved</b>${ch ? ` · ${ch} to change` : ''}<div class="bar"><i style="width:${ok/S.length*100}%"></i></div><div class="saved" style="margin-top:8px">${db ? 'Verdicts are saved with this page, so Claude can read them.' : 'Verdicts are saved on this device only.'}</div>`;
}
function syncChrome(){
  const s = S[idx];
  $('scr-title').textContent = s.name();
  $('scr-n').textContent = `${idx+1} / ${S.length}`;
  $('h-n').textContent = `${idx+1}/${S.length}`;
  const r = reviews[s.id] || {};
  const st = $('rv-status'); st.className = 'rv-status ' + (r.status||''); st.textContent = statusLabel(r.status);
  $('rv-note').value = r.note || '';
  $('rv-saved').textContent = r.at ? 'Saved ' + new Date(r.at).toLocaleString('en-CA', {dateStyle:'medium', timeStyle:'short'}) : '';
  $('notes').innerHTML = `<h3>This screen</h3><dl><div><dt>On screen one</dt><dd>${s.notes.first}</dd></div><div><dt>The one action</dt><dd>${s.notes.primary}</dd></div><div><dt>Behind ⋯ / elsewhere</dt><dd>${s.notes.more}</dd></div></dl>`;
  renderNav();
  try { history.replaceState(null, '', '#' + s.id); } catch(e) {}
}
async function saveReview(patch){
  const s = S[idx];
  const rec = Object.assign({}, reviews[s.id] || {}, patch, {at: Date.now(), lang: L, theme: dev.classList.contains('a-dark') ? 'dark' : 'light'});
  reviews[s.id] = rec;
  syncChrome();
  if (db) {
    try { await db.doc('reviews/' + s.id).set(rec); $('rv-saved').textContent = 'Saved'; }
    catch(e) { $('rv-saved').textContent = 'Could not save (' + (e && e.code || 'error') + '). Your verdict is kept on this device.'; saveLocal(); }
  } else saveLocal();
}
function saveLocal(){ try { localStorage.setItem('qa-app-reviews', JSON.stringify(reviews)); } catch(e) {} }
function loadLocal(){ try { Object.assign(reviews, JSON.parse(localStorage.getItem('qa-app-reviews') || '{}')); } catch(e) {} }
$('rv-ok').onclick = () => saveReview({status:'approved', note: $('rv-note').value.trim()});
$('rv-change').onclick = () => { if (!$('rv-note').value.trim()) { $('rv-note').focus(); $('rv-saved').textContent = 'Write what should change, then tap again.'; return; } saveReview({status:'change', note: $('rv-note').value.trim()}); };
$('rv-save').onclick = () => saveReview({note: $('rv-note').value.trim()});
$('nav').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { stack.length = 0; show(+b.dataset.i); } });
$('picker').onchange = e => { stack.length = 0; show(+e.target.value); };
$('prev').onclick = $('h-prev').onclick = () => { stack.length = 0; show(idx-1); };
$('next').onclick = $('h-next').onclick = () => { stack.length = 0; show(idx+1); };
$('hold').onclick = () => { $('devwrap').classList.add('hold'); };
$('h-x').onclick = () => { $('devwrap').classList.remove('hold'); };
document.addEventListener('keydown', e => {
  if (e.target.closest('textarea,input,select')) return;
  if (e.key === 'ArrowRight') { stack.length = 0; show(idx+1); }
  if (e.key === 'ArrowLeft') { stack.length = 0; show(idx-1); }
  if (e.key === 'Escape') $('devwrap').classList.remove('hold');
});
function setLang(l){ L = l; $('lang-en').setAttribute('aria-pressed', l==='en'); $('lang-fr').setAttribute('aria-pressed', l==='fr'); show(idx); renderSpec(); }
$('lang-en').onclick = () => setLang('en'); $('lang-fr').onclick = () => setLang('fr');
function setTheme(v){ theme = v; ['auto','light','dark'].forEach(k => $('th-'+k).setAttribute('aria-pressed', k===v)); applyTheme(); }
$('th-auto').onclick = () => setTheme('auto'); $('th-light').onclick = () => setTheme('light'); $('th-dark').onclick = () => setTheme('dark');
function setTab(spec){ $('tab-screens').setAttribute('aria-selected', !spec); $('tab-spec').setAttribute('aria-selected', spec); $('view-screens').hidden = spec; $('view-spec').hidden = !spec; }
$('tab-screens').onclick = () => setTab(false); $('tab-spec').onclick = () => setTab(true);

  </div>
  <p>Dark is designed, not inverted: the ground is a navy-black (never pure black, so photos and sheets separate from it), the primary button turns pale lavender with navy text, status colours are lighter and sit on 14 % tints. The camera is always dark.</p>

  <div><h2>Motion and feel</h2><p>Motion says where you went, never decorates. Try it on the Screens tab: tap a row (push), ‹ (pop), a tab (cross-fade), Send on the quote (sheet).</p></div>

show(idx);
renderSpec();
icons(document);

    if (!d) return;
    db = d;
    d.collection('reviews').onSnapshot(snap => {
      snap.docs.forEach(doc => { if (doc.exists) reviews[doc.id] = doc.data(); });
      saveLocal();
      syncChrome();
    }, () => {});
    renderNav();
  }).catch(() => {});
