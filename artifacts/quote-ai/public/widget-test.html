<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Widget preview · QuoteAI</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<!-- Phase 92: Settings → Widget → "Test your widget" opens this page. It
     plays a contractor's website: a plain page of its own, with the widget
     added exactly the way the pasted snippet adds it (widget-test.js builds
     the same container and script tag, with data-api-key, from ?key= and ?lang=). A lead
     sent from here is a real lead in the account. -->
<style>
  body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: #faf7f2; color: #2b2b2b; }
  header { background: #3d4a3a; color: #fff; padding: 18px 16px; }
  header strong { font-size: 20px; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  .note { font-family: system-ui, sans-serif; font-size: 14px; background: #fff; border: 1px solid #e3ddd2; border-radius: 8px; padding: 12px 14px; margin-bottom: 24px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
</style>
</head>
<body>
<header><strong>Example Renovations</strong></header>
<main>
  <p class="note" id="note">This page stands in for your website: the form below is your widget, exactly as visitors see it. A request sent from here arrives in your leads like any other.</p>
  <h1 id="heading">Kitchens, bathrooms and basements</h1>
  <p id="lede">Family business serving the region since 1998. Tell us about your project below.</p>
  <div id="slot"></div>
</main>
<script src="/widget-test.js"></script>
</body>
</html>
