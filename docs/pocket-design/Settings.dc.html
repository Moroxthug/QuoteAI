.st.si-live::before{-webkit-mask:none;mask:none;width:7px;height:7px;margin:0 2.5px;border-radius:50%;animation:stlive 2.2s cubic-bezier(.16,1,.3,1) infinite}
@keyframes stlive{0%{box-shadow:0 0 0 0 currentColor}70%,100%{box-shadow:0 0 0 5px transparent}}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:8px;font-size:11.5px;font-weight:600;background:var(--sunk);color:var(--t2);white-space:nowrap}

body{margin:0;font-family:Geist,-apple-system,"SF Pro Text","Segoe UI",sans-serif;background:#e9e8e4;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
.th{--ground:#f5f4f1;--card:#ffffff;--sunk:#efeeea;--soft:#f7f6f3;--ink:#141416;--inv:#141416;--on-inv:#ffffff;--t2:#3c3c43;--muted:#6e6e76;--faint:#8a8a90;--line:#efeeea;--line2:#e2e1dc;--ring:rgba(20,20,22,.05);--acc:#6a2fbf;--acc-t:#5e2ab0;--acc-soft:#efe9ff;--acc-soft-t:#3d1a86;--ok:#1f7a45;--ok-dot:#1f9d55;--ok-soft:#e8f3ee;--warn:#9a6412;--warn-dot:#d69524;--bad:#c2371f;--bad-soft:#fbf1ee;--info-soft:#e7f0fa;--info:#1f4f86;--av:#f1ede4;--glass:rgba(255,255,255,.84);--track-off:#dddcd8;--shadow:rgba(20,20,22,.22);--scrim:rgba(20,20,22,.2);color-scheme:light;background-color:var(--ground);color:var(--ink);transition:background-color .45s}
.th[data-theme="dark"]{--ground:#0c0c0e;--card:#18181b;--sunk:#26262b;--soft:#1f1f23;--ink:#f3f2ef;--inv:#f3f2ef;--on-inv:#141416;--t2:#d0cfd5;--muted:#a09fa7;--faint:#7c7b83;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--ring:rgba(255,255,255,.07);--acc:#8b5cf6;--acc-t:#bda6ff;--acc-soft:rgba(139,92,246,.2);--acc-soft-t:#d8caff;--ok:#62d498;--ok-dot:#34c375;--ok-soft:rgba(52,195,117,.16);--warn:#f2b660;--warn-dot:#e9a53a;--bad:#ff7d68;--bad-soft:rgba(255,125,104,.13);--info-soft:rgba(63,134,208,.2);--info:#9cc8f6;--av:#2d2a26;--glass:rgba(28,28,32,.8);--track-off:#3b3b41;--shadow:rgba(0,0,0,.6);--scrim:rgba(0,0,0,.45);color-scheme:dark}
.th[data-theme="dark"] .chk svg,.th[data-theme="dark"] .p-check svg{stroke:#141416}
.th[data-theme="dark"] svg line{stroke:rgba(255,255,255,.08)}
.th[data-theme="dark"] .shim{background:linear-gradient(90deg,#26262b 0%,#34343a 50%,#26262b 100%);background-size:200% 100%}
.th[data-theme="dark"] .mi,.th[data-theme="dark"] .ti{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(0,0,0,.5)}
.th[data-theme="dark"] input::placeholder,.th[data-theme="dark"] textarea::placeholder{color:#6f6e76}
.th .knob{background:#ffffff !important}
.aib-send{color:var(--on-inv) !important}
a{color:var(--ink);text-decoration:none}
button{font-family:inherit;cursor:pointer;letter-spacing:inherit;color:var(--ink)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:Manrope,-apple-system,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:0;font-weight:500}
.rise{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.press{transition:transform .2s cubic-bezier(.16,1,.3,1),background-color .25s}
.press:active{transform:scale(.93)}
.card{background:var(--card);border-radius:22px;box-shadow:0 0 0 1px var(--ring);overflow:hidden;transition:background-color .45s}
.gt{margin:28px 20px 10px;font-size:17px;font-weight:600;letter-spacing:-0.025em}
.row{display:flex;align-items:center;gap:14px;padding:0 16px}
.txt-wrap{flex-grow:1;min-width:0;display:flex;flex-direction:column;padding-bottom:0}
.txt-line{display:flex;align-items:center;gap:12px;min-height:60px}
.txt{flex-grow:1;display:flex;flex-direction:column;gap:2px;padding:11px 0;min-width:0}
.txt b{font-size:15px;font-weight:500}
.txt small{font-size:12.5px;color:var(--muted);line-height:1.35}
.seg{position:relative;display:grid;padding:2px;border-radius:11px;background:var(--sunk);margin:0 0 14px}
.seg-ind{position:absolute;top:2px;left:2px;height:32px;border-radius:9px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.mi{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.06),0 1px 2px rgba(20,20,22,.12)}
.mi::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 0%,rgba(255,255,255,.28),rgba(255,255,255,0) 60%)}
.mi svg{position:relative;z-index:1;display:block}
.gi{display:block;flex-shrink:0;overflow:visible;transition:transform .35s cubic-bezier(.16,1,.3,1)}
.row:hover .gi{transform:scale(1.08) rotate(-4deg)}
.slide{transition:transform .45s cubic-bezier(.16,1,.3,1)}
.fade{transition:color .3s}
.track{transition:background-color .3s}
.knob{transition:transform .4s cubic-bezier(.34,1.4,.64,1)}
.th[data-theme="dark"] .about-logo{filter:brightness(1.4) saturate(1.1)}
.vo{position:relative;width:48px;height:48px;border-radius:50%;overflow:hidden;animation:morph 7s ease-in-out infinite}
.vo i{position:absolute;width:75%;height:75%;border-radius:50%;filter:blur(8px);mix-blend-mode:screen}
.vo i:nth-child(1){left:-12%;top:0;animation:m1 5s ease-in-out infinite}
.vo i:nth-child(2){right:-16%;bottom:-12%;animation:m2 6s ease-in-out infinite}
.vo i:nth-child(3){right:-6%;top:-20%;animation:m3 7s ease-in-out infinite}
.vo::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.6),rgba(255,255,255,0) 42%)}
.vring{transition:box-shadow .35s,transform .35s cubic-bezier(.16,1,.3,1)}
@keyframes morph{0%,100%{border-radius:50%}33%{border-radius:53% 47% 51% 49%/47% 54% 46% 53%}66%{border-radius:47% 53% 48% 52%/53% 47% 53% 47%}}
@keyframes m1{50%{transform:translate(28%,18%) scale(1.15)}}
@keyframes m2{50%{transform:translate(-22%,-26%) scale(.9)}}
@keyframes m3{50%{transform:translate(-30%,24%) scale(1.2)}}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.row{position:relative}
.row-hit{position:absolute;inset:0;z-index:1;border-radius:inherit}

.th[data-theme="light"][data-ground="lavender"]{--ground:#f4f2fa;--sunk:#eae6f4;--soft:#f9f8fd;--line:#eae6f3;--line2:#ddd7ec;--av:#ece7f6;background-color:var(--ground)}
.th[data-theme="light"][data-ground="dawn"]{--muted:#66666e;--ground:#f2f2f8;--sunk:#e8e7f2;--soft:#f7f7fb;--line:#e8e7f1;--line2:#dcdbe9;--av:#e9e6f4;background-color:var(--ground);background-image:linear-gradient(180deg,#eee8fa 0,#f1eef9 200px,#f3f5f8 480px)}

<div class="th" data-theme="{{theme}}" data-ground="{{ground}}" style="width: 390px; height: 2000px; box-sizing: border-box; padding-bottom: 40px">

<header style="padding: 8px 8px 0; display: flex; align-items: center; height: 52px">
<a href="Menu.dc.html" class="press" aria-label="Back to menu" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg></a>
</header>
<h1 class="rise" style="margin: 2px 20px 0; font-size: 30px; font-weight: 600; letter-spacing: -0.045em">Settings</h1>
<div class="rise" style="margin: 14px 16px 0; height: 44px; border-radius: 14px; background: var(--sunk); display: flex; align-items: center; gap: 9px; padding: 0 14px; animation-delay: 40ms">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" style="color: var(--faint); flex-shrink: 0"><circle cx="11" cy="11" r="6.5"></circle><path d="m20 20-4-4"></path></svg>
<label for="set-search" class="vh">Search settings</label>
<input id="set-search" placeholder="Search settings" autocomplete="off" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: var(--ink)">
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<section class="rise" style="{{g.delay}}">
<h2 class="gt">{{g.title}}</h2>
<div class="card" style="margin: 0 16px">

<sc-if value="{{g.hasVoices}}" hint-placeholder-val="{{ false }}">
<div class="row" style="align-items: flex-start; padding-top: 4px">
<svg class="gi" width="28" height="28" viewBox="5.5 5.5 19 19" aria-hidden="true" style="margin-top: 12px"><defs><linearGradient id="{{voiceIc.gid}}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{voiceIc.c0}}"></stop><stop offset="1" stop-color="{{voiceIc.c1}}"></stop></linearGradient></defs><path d="{{voiceIc.d3}}" fill="url(#{{voiceIc.gid}})" fill-opacity="0.35"></path><path d="{{voiceIc.d2}}" fill="url(#{{voiceIc.gid}})" fill-opacity="0.6"></path><path d="{{voiceIc.d1}}" fill="url(#{{voiceIc.gid}})"></path></svg>
<span class="txt" style="padding-bottom: 14px">
<b>Voice</b><small>{{voiceName}}</small>
<span role="radiogroup" aria-label="Assistant voice" style="margin-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{voices}}" as="v" hint-placeholder-count="3">
<button class="press" role="radio" onClick="{{v.pick}}" aria-checked="{{v.on}}" aria-label="{{v.name}}" style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 2px 0">
<span class="vring" style="border-radius: 50%; padding: 3px; {{v.ring}}"><span class="vo" style="display: block; background: {{v.base}}"><i style="background: {{v.c1}}"></i><i style="background: {{v.c2}}"></i><i style="background: {{v.c3}}"></i></span></span>
<span style="font-size: 12.5px; font-weight: 500; {{v.nameStyle}}">{{v.name}}</span>
</button>
</sc-for>
</span>
</span>
</div>
</sc-if>

<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<div class="row" style="{{r.wrap}}">
<svg class="gi" width="28" height="28" viewBox="5.5 5.5 19 19" aria-hidden="true"><defs><linearGradient id="{{r.gid}}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{r.c0}}"></stop><stop offset="1" stop-color="{{r.c1}}"></stop></linearGradient></defs><path d="{{r.d3}}" fill="url(#{{r.gid}})" fill-opacity="0.35"></path><path d="{{r.d2}}" fill="url(#{{r.gid}})" fill-opacity="0.6"></path><path d="{{r.d1}}" fill="url(#{{r.gid}})"></path></svg>
<span class="txt-wrap" style="{{r.sep}}">
<span class="txt-line">
<span class="txt"><b>{{r.label}}</b><sc-if value="{{r.hasSub}}" hint-placeholder-val="{{ true }}"><small>{{r.sub}}</small></sc-if></span>

<sc-if value="{{r.isSwitch}}" hint-placeholder-val="{{ false }}">
<button class="press track" role="switch" onClick="{{r.flip}}" aria-checked="{{r.on}}" aria-label="{{r.label}}" style="width: 51px; height: 31px; border-radius: 999px; border: 0; padding: 2px; flex-shrink: 0; display: flex; {{r.track}}"><span class="knob" style="width: 27px; height: 27px; border-radius: 50%; background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,.2); {{r.knob}}"></span></button>
</sc-if>

<sc-if value="{{r.isStepper}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; align-items: center; background: var(--sunk); border-radius: 11px; padding: 2px; flex-shrink: 0">
<button class="press" onClick="{{r.dec}}" aria-label="{{r.decLabel}}" style="width: 34px; height: 34px; border-radius: 9px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
<span class="mono" style="min-width: 56px; text-align: center; font-size: 13.5px">{{r.val}}</span>
<button class="press" onClick="{{r.inc}}" aria-label="{{r.incLabel}}" style="width: 34px; height: 34px; border-radius: 9px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M12 5v14"></path></svg></button>
</span>
</sc-if>

<sc-if value="{{r.isLink}}" hint-placeholder-val="{{ false }}">
<sc-if value="{{r.hasHref}}" hint-placeholder-val="{{ false }}"><a href="{{r.href}}" class="row-hit" aria-label="{{r.label}}"></a></sc-if>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); flex-shrink: 0">{{r.val}}<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--faint)"><path d="m9 6 6 6-6 6"></path></svg></span>
</sc-if>
</span>

<sc-if value="{{r.isSeg}}" hint-placeholder-val="{{ false }}">
<span role="group" aria-label="{{r.label}}" class="seg" style="{{r.segCols}}">
<span class="slide seg-ind" aria-hidden="true" style="{{r.ind}}"></span>
<sc-for list="{{r.opts}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.on}}" class="fade" style="position: relative; height: 32px; border: 0; background: transparent; font-weight: 500; {{o.style}}">{{o.label}}</button></sc-for>
</span>
</sc-if>
</span>
</div>
</sc-for>
</div>
</section>
