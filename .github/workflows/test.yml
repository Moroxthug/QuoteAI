name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # lib/db/drizzle.config.ts refuses to load without a DATABASE_URL; the
      # static checks below never open a connection, so any placeholder works.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Phase 61 (docs/QA-VERIFICATION-PLAN.md): the full static toolchain.
      - name: Typecheck (root — libs + both apps + scripts)
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Dead code (knip)
        run: pnpm run knip
      - name: Unit tests
        run: pnpm run test
      - name: Build
        run: pnpm -r --if-present run build
