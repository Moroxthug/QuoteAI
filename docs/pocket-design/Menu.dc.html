    var pl = {
      cls: pOpen ? 'open' : '', open: pOpen, fold: pOpen ? 'on' : '',
      toggle: function () { self.setState({ plOpen: !self.g('plOpen', false) }); },
      cur: fic(P[CUR].icon[0], P[CUR].icon[1]),
      curPrice: bill === 'm' ? '$249' : '$2,490', curPer: bill === 'm' ? '/month' : '/year',
      tierInd: 'transform: translateX(' + (sel * 100) + '%)',
      sel: { name: tgt.name, pitch: tgt.pitch, price: tgt.big, per: tgt.bigSub },
      billInd: bill === 'm' ? 'transform: translateX(0)' : 'transform: translateX(100%)',
      isMonthly: bill === 'm', isYearly: bill === 'y',
      mStyle: bill === 'm' ? 'color: var(--ink)' : 'color: var(--muted)',
      yStyle: bill === 'y' ? 'color: var(--ink)' : 'color: var(--muted)',
      monthly: function () { self.setState({ plBill: 'm' }); }, yearly: function () { self.setState({ plBill: 'y' }); },
      plans: P.map(function (p, k) {
        var on = k === sel;
        return { name: p.name, sub: k === CUR ? 'Current' : p.capShort, on: on, ic: fic(p.icon[0], p.icon[1]),
          iconStyle: on ? 'filter: none; opacity: 1; transform: scale(1.08)' : 'filter: grayscale(.85); opacity: .55',
          nameStyle: on ? 'color: var(--ink)' : 'color: var(--muted)',
          pick: function () { self.setState({ plSel: k, plDone: false }); } };
      }),
      diffTitle: title, items: items,
      cta: cta, note: note, ctaStyle: ctaStyle, done: done && sel < CUR,
      act: function () { if (self.g('plSel', 2) < CUR) self.setState({ plDone: !self.g('plDone', false) }); }
    };
    return { pl: pl, theme: dark ? 'dark' : 'light', groups: groups, quick: quick, clock: ic('clock', 'teal') };
  }
}
</script>
